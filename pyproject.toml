[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "morph-v-review"
version = "0.1.0"
description = "Minimal anonymous MORPH-V implementation and frozen-record reproduction."
readme = "README.md"
requires-python = ">=3.9"
dependencies = ["PyYAML==6.0.3"]

[project.optional-dependencies]
test = ["pytest==8.4.2"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
